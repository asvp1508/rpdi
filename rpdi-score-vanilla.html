let state = { filter: "all", search: "", sortBy: "rpdi", showPending: false, selectedFilm: null, requested: false };

function getRPDIColor(rpdi) {
  if (rpdi < 0.25) return "#00C853";
  if (rpdi < 0.50) return "#FFD600";
  if (rpdi < 0.75) return "#FF6D00";
  return "#D50000";
}
function stars(n) { return "⭐".repeat(n) + "☆".repeat(5 - n); }

function getFiltered() {
  let list = FILMS.filter(f => {
    if (state.search) {
      const s = state.search.toLowerCase();
      return f.title.toLowerCase().includes(s) || f.director.toLowerCase().includes(s) || f.language.toLowerCase().includes(s);
    }
    if (state.filter === "minimal") return f.rpdi < 0.25;
    if (state.filter === "moderate") return f.rpdi >= 0.25 && f.rpdi < 0.50;
    if (state.filter === "high") return f.rpdi >= 0.50 && f.rpdi < 0.75;
    if (state.filter === "extreme") return f.rpdi >= 0.75;
    return true;
  });
  list.sort((a, b) => {
    if (state.sortBy === "rpdi") return a.rpdi - b.rpdi;
    if (state.sortBy === "rpdi-desc") return b.rpdi - a.rpdi;
    if (state.sortBy === "gap") return b.gap - a.gap;
    if (state.sortBy === "year") return b.year - a.year;
    if (state.sortBy === "imdb") return b.imdb - a.imdb;
    return 0;
  });
  return list;
}

function glowBar(value, color, label) {
  return `<div style="margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;color:#888;" class="mono">
      <span>${label}</span><span style="color:${color}">${value.toFixed(3)}</span>
    </div>
    <div class="glow-bar-bg"><div class="glow-bar-fill" style="width:${value*100}%;background:${color};box-shadow:0 0 8px ${color};"></div></div>
  </div>`;
}

        <div><div style="font-size:10px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;" class="mono">Historical Period</div><div style="font-size:13px;color:#aaa;">${f.period}</div></div>

}

function render() {
  const filtered = getFiltered();
  const avgRPDI = (FILMS.reduce((s,f) => s+f.rpdi, 0) / FILMS.length).toFixed(3);
  const gaslightCount = FILMS.filter(f => f.gap >= 0.26).length;

  document.getElementById("app").innerHTML = `
    <!-- HERO -->
    <div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden;border-bottom:1px solid #111;">
      <div style="position:absolute;width:600px;height:600px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle, rgba(180,30,30,0.06) 0%, transparent 70%);pointer-events:none;"></div>
      <div style="text-align:center;max-width:800px;padding:0 24px;position:relative;">
        <div style="display:inline-flex;align-items:center;gap:8px;border:1px solid #1f1f1f;border-radius:100px;padding:6px 16px;margin-bottom:32px;font-size:11px;color:#555;text-transform:uppercase;letter-spacing:2px;" class="mono">
          <div style="width:6px;height:6px;border-radius:50%;background:#D50000;animation:pulse 2s infinite;"></div>
          Historical Cinema Intelligence
        </div>
        <h1 style="font-size:clamp(48px,10vw,96px);font-weight:900;letter-spacing:-2px;line-height:0.9;margin:0 0 24px;background:linear-gradient(135deg,#fff 0%,#666 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;" class="serif">RPDI Score</h1>
        <p style="font-size:clamp(15px,2.5vw,20px);color:#555;line-height:1.6;max-width:560px;margin:0 auto 16px;font-weight:300;">The first mathematical framework measuring historical accuracy in world cinema.</p>
        <p style="font-size:13px;color:#333;margin-bottom:48px;" class="mono">D = 1 − (Σwᵢaᵢ / Σwᵢ) · RPDI = 0.6D + 0.4L · Gap = |D − L|</p>
        <div style="display:flex;gap:32px;justify-content:center;flex-wrap:wrap;">
          ${[["13","Films Scored"],["500","Dataset Target"],[avgRPDI,"Average RPDI"],[String(gaslightCount),"Gaslighting Films"]].map(s => `
            <div style="text-align:center;"><div style="font-size:32px;font-weight:800;color:#fff;line-height:1;" class="mono">${s[0]}</div><div style="font-size:11px;color:#444;text-transform:uppercase;letter-spacing:1.5px;margin-top:6px;">${s[1]}</div></div>`).join("")}
        </div>
        <div style="margin-top:48px;">
          <button onclick="document.getElementById('database').scrollIntoView({behavior:'smooth'})" style="background:#fff;color:#000;border:none;padding:14px 32px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-right:12px;">Explore Database</button>
          <button onclick="document.getElementById('methodology').scrollIntoView({behavior:'smooth'})" style="background:transparent;color:#555;border:1px solid #1f1f1f;padding:14px 32px;border-radius:8px;font-size:14px;cursor:pointer;">How It Works</button>
        </div>
      </div>
      <div style="position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;animation:bounce 2s infinite;" class="mono">↓ Scroll</div>
    </div>

    <!-- SCALE LEGEND -->
    <div style="padding:40px 24px;border-bottom:1px solid #0d0d0d;max-width:1200px;margin:0 auto;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;">
        ${[["0.00 – 0.24","Minimal Distortion","#00C853","Factual + honest"],["0.25 – 0.49","Moderate Distortion","#FFD600","Some dramatisation"],["0.50 – 0.74","High Distortion","#FF6D00","Significant invention"],["0.75 – 1.00","Extreme Distortion","#D50000","Historical fabrication"]].map(s => `
          <div style="padding:14px 16px;border-radius:8px;background:${s[2]}08;border:1px solid ${s[2]}22;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><div style="width:8px;height:8px;border-radius:50%;background:${s[2]};box-shadow:0 0 6px ${s[2]};"></div><span style="font-size:11px;color:${s[2]};text-transform:uppercase;letter-spacing:1px;" class="mono">${s[1]}</span></div>
            <div style="font-size:16px;color:#fff;font-weight:600;" class="mono">${s[0]}</div>
            <div style="font-size:11px;color:#555;margin-top:2px;">${s[3]}</div>
          </div>`).join("")}
      </div>
    </div>

    <!-- DATABASE -->
    <div id="database" style="max-width:1200px;margin:0 auto;padding:60px 24px;">
      <div style="margin-bottom:36px;">
        <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;" class="mono">— Film Database</div>
        <h2 style="font-size:36px;font-weight:700;margin:0;" class="serif">Scored Films</h2>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;align-items:center;">
        <input id="searchInput" value="${state.search}" placeholder="Search films, directors..." style="background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;padding:10px 16px;color:#fff;font-size:13px;outline:none;width:220px;" />
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${[["all","All Films"],["minimal","Minimal"],["moderate","Moderate"],["high","High"],["extreme","Extreme"]].map(f => `
            <button class="filter-pill ${state.filter===f[0] ? 'active' : ''}" data-filter="${f[0]}">${f[1]}</button>`).join("")}
        </div>
        <select id="sortSelect" style="background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;padding:10px 14px;color:#555;font-size:12px;outline:none;cursor:pointer;margin-left:auto;" class="mono">
          <option value="rpdi" ${state.sortBy==="rpdi"?"selected":""}>Sort: RPDI ↑</option>
          <option value="rpdi-desc" ${state.sortBy==="rpdi-desc"?"selected":""}>Sort: RPDI ↓</option>
          <option value="gap" ${state.sortBy==="gap"?"selected":""}>Sort: Gap ↓</option>
          <option value="year" ${state.sortBy==="year"?"selected":""}>Sort: Year ↓</option>
          <option value="imdb" ${state.sortBy==="imdb"?"selected":""}>Sort: IMDb ↓</option>
        </select>
      </div>
      <div style="font-size:12px;color:#333;margin-bottom:20px;" class="mono">Showing ${filtered.length} of ${FILMS.length} scored films</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">
        ${filtered.map(filmCardHTML).join("")}
      </div>

      <div style="margin-top:60px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
          <div>
            <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;" class="mono">— Scoring Queue</div>
            <h3 style="font-size:24px;font-weight:700;margin:0;color:#555;" class="serif">${PENDING_COUNT} Films Pending</h3>
          </div>
          <button id="togglePending" style="background:#0d0d0d;border:1px solid #1a1a1a;color:#555;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;" class="mono">${state.showPending ? "Hide" : "Show Preview"}</button>
        </div>
        ${state.showPending ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">
          ${PENDING_FILMS.map(pendingCardHTML).join("")}
          <div style="background:#050505;border:1px dashed #111;border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:140px;text-align:center;">
            <div style="font-size:28px;color:#222;margin-bottom:8px;">+${PENDING_COUNT - PENDING_FILMS.length}</div>
            <div style="font-size:12px;color:#333;" class="mono">more in queue</div>
          </div>
        </div>` : ""}
      </div>

      <div style="margin-top:60px;padding:32px;border-radius:12px;background:#0a0a0a;border:1px solid #1a1a1a;">
        <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;" class="mono">— Community</div>
        <h3 style="font-size:20px;font-weight:700;margin:0 0 8px;" class="serif">Request a Film</h3>
        <p style="font-size:13px;color:#555;margin:0 0 20px;line-height:1.6;">Don't see a historical film you want scored? Submit a request and we'll add it to our queue.</p>
        ${state.requested ? `<div style="padding:12px 16px;border-radius:8px;background:#00C85310;border:1px solid #00C85330;font-size:13px;color:#00C853;" class="mono">✓ Request received. We'll score it soon.</div>` :
        `<div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input id="requestInput" placeholder="Film title, year, language..." style="flex:1;min-width:200px;background:#111;border:1px solid #1f1f1f;border-radius:8px;padding:10px 16px;color:#fff;font-size:13px;outline:none;" />
          <button id="submitRequest" style="background:#fff;color:#000;border:none;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Submit</button>
        </div>`}
      </div>
    </div>

    <!-- METHODOLOGY -->
    <div id="methodology" style="border-top:1px solid #0d0d0d;padding:80px 24px;max-width:1200px;margin:0 auto;">
      <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;" class="mono">— Framework</div>
      <h2 style="font-size:36px;font-weight:700;margin:0 0 48px;" class="serif">How It Works</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;">
        <div style="padding:24px;background:#0a0a0a;border:1px solid #111;border-radius:12px;">
          <div style="font-size:11px;color:#4ECDC4;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;" class="mono">Fact Score (D)</div>
          <div style="font-size:24px;color:#fff;margin-bottom:16px;font-weight:600;" class="mono">1 − (Σwᵢaᵢ / Σwᵢ)</div>
          <p style="font-size:13px;color:#555;line-height:1.7;margin:0;">Each historical claim is scored for accuracy (0–1) and weighted by narrative importance. Spine-level claims (weight 5) drive major D score changes. Low D = high factual accuracy.</p>
          <div style="margin-top:16px;">
            ${[[5,"Spine","Remove this — film collapses"],[4,"Soul","Character motivations"],[3,"Skeleton","Major historical events"],[2,"Flesh","Biographical details"],[1,"Skin","Visual accuracy"]].map(r => `
              <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #111;">
                <div style="width:24px;height:24px;border-radius:4px;background:#4ECDC420;border:1px solid #4ECDC444;display:flex;align-items:center;justify-content:center;font-size:11px;color:#4ECDC4;flex-shrink:0;" class="mono">${r[0]}</div>
                <div><div style="font-size:12px;color:#aaa;font-weight:600;">${r[1]}</div><div style="font-size:11px;color:#444;">${r[2]}</div></div>
              </div>`).join("")}
          </div>
        </div>
        <div style="padding:24px;background:#0a0a0a;border:1px solid #111;border-radius:12px;">
          <div style="font-size:11px;color:#FF6B6B;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;" class="mono">Feel Score (L)</div>
          <div style="font-size:24px;color:#fff;margin-bottom:16px;font-weight:600;" class="mono">(S + P + F + E) / 4</div>
          <p style="font-size:13px;color:#555;line-height:1.7;margin:0 0 16px;">Measures narrative manipulation independent of factual claims. High L = emotionally dramatised regardless of accuracy.</p>
          ${[["S","Simplification","Complex politics → simple hero/villain?"],["P","Portrayal","Human or superhuman protagonist?"],["F","Framing","Balanced or single ideological lens?"],["E","Exaggeration","Realistic or physically impossible action?"]].map(d => `
            <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #111;">
              <div style="width:24px;height:24px;border-radius:4px;background:#FF6B6B20;border:1px solid #FF6B6B44;display:flex;align-items:center;justify-content:center;font-size:11px;color:#FF6B6B;flex-shrink:0;" class="mono">${d[0]}</div>
              <div><div style="font-size:12px;color:#aaa;font-weight:600;">${d[1]}</div><div style="font-size:11px;color:#444;">${d[2]}</div></div>
            </div>`).join("")}
        </div>
        <div style="padding:24px;background:#0a0a0a;border:1px solid #111;border-radius:12px;">
          <div style="font-size:11px;color:#D50000;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;" class="mono">The Gap — Original Contribution</div>
          <div style="font-size:24px;color:#fff;margin-bottom:16px;font-weight:600;" class="mono">|D − L|</div>
          <p style="font-size:13px;color:#555;line-height:1.7;margin:0 0 20px;">The most important metric. Reveals when films use factual accuracy as cover for emotional manipulation — a pattern we call cinematic gaslighting.</p>
          ${[["0.00–0.14","Honest","Facts and feeling align","#00C853"],["0.15–0.25","Partially Misleading","Some inconsistency","#FFD600"],["0.26–0.40","Gaslighting","True facts, false feeling","#FF6D00"],["0.41+","Extreme Gaslighting","Maximum disconnect","#D50000"]].map(g => `
            <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #111;">
              <div style="width:6px;height:6px;border-radius:50%;background:${g[3]};box-shadow:0 0 6px ${g[3]};flex-shrink:0;margin-left:9px;"></div>
              <div><div style="font-size:12px;color:${g[3]};" class="mono">${g[0]}</div><div style="font-size:11px;color:#aaa;">${g[1]} — ${g[2]}</div></div>
            </div>`).join("")}
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div style="border-top:1px solid #0d0d0d;padding:80px 24px;max-width:1200px;margin:0 auto;">
      <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;" class="mono">— Research Findings</div>
      <h2 style="font-size:36px;font-weight:700;margin:0 0 48px;" class="serif">What The Data Shows</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;">
        ${[[`${gaslightCount}/13`,"Films Show Gaslighting","Gap ≥ 0.26 — using factual accuracy to hide narrative manipulation","#FF6D00"],
           ["0.000","IMDb Correlation","Audience ratings show zero correlation with RPDI — traditional reviews miss historical distortion entirely","#4ECDC4"],
           ["100%","Spine Fabrication Rule","Every film with a fabricated Weight 5 claim scores Gaslighting or worse. Zero exceptions.","#D50000"],
           ["0.185","Minimum RPDI","Rocketry — the only film achieving Minimal Distortion, using Supreme Court records as primary source","#00C853"]].map(s => `
          <div style="padding:24px;background:#0a0a0a;border:1px solid ${s[3]}22;border-radius:12px;">
            <div style="font-size:40px;font-weight:800;color:${s[3]};line-height:1;margin-bottom:12px;" class="mono">${s[0]}</div>
            <div style="font-size:13px;color:#aaa;font-weight:600;margin-bottom:8px;">${s[1]}</div>
            <div style="font-size:12px;color:#555;line-height:1.6;">${s[2]}</div>
          </div>`).join("")}
      </div>
      <div style="margin-top:24px;padding:28px 32px;border-radius:12px;background:#0a0a0a;border:1px solid #1a1a1a;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;">
        <div style="grid-column:1 / -1;margin-bottom:8px;">
          <div style="font-size:11px;color:#333;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;" class="mono">— Primary Survey Research (n=14)</div>
          <div style="font-size:13px;color:#555;">Empirical validation of the problem RPDI solves</div>
        </div>
        ${[["71.4%","prefer films for learning history"],["85.7%","believe films influence perception"],["64.3%","mostly assume films are accurate"],["35.7%","would verify independently"]].map(s => `
          <div><div style="font-size:28px;font-weight:800;color:#fff;" class="mono">${s[0]}</div><div style="font-size:12px;color:#444;margin-top:4px;">${s[1]}</div></div>`).join("")}
      </div>
    </div>

    <!-- FOOTER -->
    <div style="border-top:1px solid #0d0d0d;padding:40px 24px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
      <div>
        <div style="font-size:18px;font-weight:700;margin-bottom:4px;" class="serif">RPDI Score</div>
        <div style="font-size:12px;color:#333;" class="mono">Created by Arjun Pathi · 2026</div>
      </div>
      <div style="display:flex;gap:24px;">
        ${["Methodology","Research Paper","Contact"].map(l => `<span style="font-size:12px;color:#444;cursor:pointer;" class="mono">${l}</span>`).join("")}
      </div>
    </div>

    <div class="modal-overlay ${state.selectedFilm ? 'open' : ''}" id="modalOverlay" onclick="closeModal()">
      ${modalHTML(state.selectedFilm)}
    </div>
  `;

  attachEvents();
}

function attachEvents() {
  document.querySelectorAll(".film-card").forEach(card => {
    card.addEventListener("click", () => {
      const id = parseInt(card.dataset.id);
      state.selectedFilm = FILMS.find(f => f.id === id);
      render();
    });
  });
  document.querySelectorAll(".filter-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      state.search = "";
      render();
    });
  });
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      render();
      // restore focus + cursor position after re-render
      const el = document.getElementById("searchInput");
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    });
  }
  const sortSelect = document.getElementById("sortSelect");
  if (sortSelect) {
    sortSelect.addEventListener("change", (e) => {
      state.sortBy = e.target.value;
      render();
    });
  }
  const togglePending = document.getElementById("togglePending");
  if (togglePending) {
    togglePending.addEventListener("click", () => {
      state.showPending = !state.showPending;
      render();
    });
  }
  const submitRequest = document.getElementById("submitRequest");
  if (submitRequest) {
    submitRequest.addEventListener("click", () => {
      const val = document.getElementById("requestInput").value;
      if (val.trim()) {
        state.requested = true;
        render();
      }
    });
  }
}

function closeModal() {
  state.selectedFilm = null;
  render();
}

render();
</script>
</body>
</html>
